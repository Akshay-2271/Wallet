databaseChangeLog:
  - changeSet:
      id: 1
      author: akshay

      changes:
        - createTable:
            tableName: wallet

            columns:
              - column:
                  name: id
                  type: UUID

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: balance
                  type: NUMERIC(19,2)

                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

                  constraints:
                    nullable: false
