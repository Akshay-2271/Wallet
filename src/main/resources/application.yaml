server:
  port: 8081

spring:
  application:
    name: wallet

  datasource:
    url: jdbc:postgresql://localhost:5432/walletdb?currentSchema=public
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: public