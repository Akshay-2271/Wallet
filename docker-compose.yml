version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: wallet-postgres

    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wallet_user -d wallet_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: wallet-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: wallet_user
      SPRING_DATASOURCE_PASSWORD: wallet_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      SPRING_LIQUIBASE_ENABLED: true

      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres_data: